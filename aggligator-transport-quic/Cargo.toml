[package]
name = "aggligator-transport-quic"
version = "0.1.0"
description = "Aggligator transport: QUIC"
categories = ["asynchronous", "network-programming"]
keywords = ["aggligator", "aggligator-transport", "quic"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["rustls-aws-lc-rs"]
## Use rustls with the aws-lc-rs crypto provider for QUIC.
rustls-aws-lc-rs = ["quinn/rustls-aws-lc-rs"]
## Use rustls with the ring crypto provider for QUIC.
rustls-ring = ["quinn/rustls-ring"]

[dependencies]
aggligator = { version = "0.12.0", path = "../aggligator" }
aggligator-transport-tcp = { version = "0.6.0", path = "../aggligator-transport-tcp", default-features = false }

async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }

quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
socket2 = "0.6.0"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
